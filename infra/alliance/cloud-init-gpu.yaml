#cloud-config
# k3s agent on the vGPU instance (the compaction service's node). Installs the Arbutus GRID guest
# driver with its license token as docs.alliancecan.ca/wiki/Using_cloud_vGPUs describes, the NVIDIA
# container toolkit, then k3s with nvidia as the default container runtime. Reboots once (kernel
# update before DKMS); the second boot runs /opt/lsm/gpu-node.sh to finish.
package_update: true
package_upgrade: true
packages: [curl, dkms, build-essential, gnupg]
write_files:
  - path: /etc/modprobe.d/blacklist-nouveau.conf
    content: |
      blacklist nouveau
      options nouveau modeset=0
  - path: /opt/lsm/gpu-node.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euxo pipefail
      exec >> /var/log/lsm-gpu-node.log 2>&1
      [ -f /opt/lsm/done ] && exit 0
      store=https://object-arbutus.alliancecan.ca/swift/v1/6c87c15eb7d2468daf3d2bd0c58bbfce/vgpu
      driver=${LSM_GRID_DRIVER:-NVIDIA-Linux-x86_64-580.105.08-grid.run}
      apt-get install -y linux-headers-$(uname -r)
      cd /opt/lsm
      [ -f "$driver" ] || curl -fLO "$store/$driver"
      chmod 755 "$driver"
      ./"$driver" --silent --dkms
      mkdir -p /etc/nvidia/ClientConfigToken
      curl -fL "$store/kalpa-prod.tok" -o /etc/nvidia/ClientConfigToken/kalpa-prod.tok
      echo "FeatureType=4" > /etc/nvidia/gridd.conf
      systemctl enable --now nvidia-gridd
      for i in $(seq 1 60); do nvidia-smi -q | grep -q "License Status *: Licensed" && break; sleep 5; done
      nvidia-smi
      curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
      curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list \
        | sed 's#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#' \
        > /etc/apt/sources.list.d/nvidia-container-toolkit.list
      apt-get update && apt-get install -y nvidia-container-toolkit
      until curl -sk https://__SERVER_IP__:6443/ping >/dev/null; do sleep 5; done
      curl -sfL https://get.k3s.io | INSTALL_K3S_CHANNEL=stable K3S_URL=https://__SERVER_IP__:6443 \
        K3S_TOKEN=__TOKEN__ sh -s - agent --default-runtime nvidia \
        --node-label lsm/role=service --node-taint lsm/role=service:NoSchedule \
        --kubelet-arg=cpu-manager-policy=static --kubelet-arg=kube-reserved=cpu=250m,memory=1Gi \
        --kubelet-arg=system-reserved=cpu=250m,memory=1Gi
      touch /opt/lsm/done
  - path: /etc/systemd/system/lsm-gpu-node.service
    content: |
      [Unit]
      Description=LSM GPU node setup (driver, license, toolkit, k3s agent)
      After=network-online.target
      Wants=network-online.target
      [Service]
      Type=oneshot
      ExecStart=/opt/lsm/gpu-node.sh
      [Install]
      WantedBy=multi-user.target
runcmd:
  - update-initramfs -u
  - systemctl daemon-reload
  - systemctl enable lsm-gpu-node.service
power_state:
  mode: reboot
  condition: true
