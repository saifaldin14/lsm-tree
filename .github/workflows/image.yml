name: Container image
# Builds the cloud experiment image (Dockerfile; docs/cloud.md) and pushes it to
# ghcr.io/<owner>/lsm-tree with tags <variant>-<commit> and <variant>-latest.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, CMakeLists.txt, cmake/**, vcpkg.json, scripts/bootstrap*.sh,
            src/**, include/**, apps/**, tests/**, .github/workflows/image.yml]
permissions:
  contents: read
  packages: write
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            build_base: ubuntu:24.04
            run_base: ubuntu:24.04
          - variant: cuda
            build_base: nvidia/cuda:12.4.1-devel-ubuntu22.04
            run_base: nvidia/cuda:12.4.1-runtime-ubuntu22.04
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: name
        run: echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr A-Z a-z)/lsm-tree" >> "$GITHUB_OUTPUT"
      - name: Dependencies stage (cached on its own)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: deps
          build-args: |
            VARIANT=${{ matrix.variant }}
            BUILD_BASE=${{ matrix.build_base }}
            RUN_BASE=${{ matrix.run_base }}
          cache-from: type=gha,scope=deps-${{ matrix.variant }}
          cache-to: type=gha,scope=deps-${{ matrix.variant }},mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VARIANT=${{ matrix.variant }}
            BUILD_BASE=${{ matrix.build_base }}
            RUN_BASE=${{ matrix.run_base }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.name.outputs.image }}:${{ matrix.variant }}-${{ github.sha }}
            ${{ steps.name.outputs.image }}:${{ matrix.variant }}-latest
          cache-from: |
            type=gha,scope=deps-${{ matrix.variant }}
            type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,scope=${{ matrix.variant }},mode=max
