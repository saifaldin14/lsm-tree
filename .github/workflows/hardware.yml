name: Required GPU Checks
on:
  workflow_dispatch:
    inputs:
      backend:
        description: Trusted self-hosted GPU worker
        type: choice
        options: [metal, cuda]
        required: true
permissions:
  contents: read
jobs:
  hardware:
    runs-on: [self-hosted, "${{ inputs.backend }}"]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Native dependencies
        run: bash scripts/bootstrap.sh
      - name: CUDA dependency
        if: inputs.backend == 'cuda'
        run: bash scripts/bootstrap-cuda.sh
      - name: Configure Metal
        if: inputs.backend == 'metal'
        run: cmake --preset dev -DLSM_ENABLE_METAL=ON
      - name: Configure CUDA
        if: inputs.backend == 'cuda'
        run: cmake --preset dev -DLSM_ENABLE_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=native
      - name: Require actual GPU work
        env:
          BACKEND: ${{ inputs.backend }}
        run: |
          cmake --build --preset dev
          build/dev/lsm_gpu_check "${BACKEND}_batched" --require
          ctest --preset dev -R 'blocks.transforms|worker.lifecycle|hardware|telemetry.native' --output-on-failure
      - name: Require GPU resource sensors
        env:
          BACKEND: ${{ inputs.backend }}
        run: |
          required='host_gpu:gpu_utilization_percent,host_gpu:gpu_memory_used_bytes'
          if [ "$BACKEND" = cuda ]; then
            required="$required,host_gpu:power_watts,host_gpu:energy_joules,host_gpu:temperature_celsius"
          fi
          mkdir -p artifacts
          build/dev/lsm_telemetry --role hardware_check --duration-seconds 3 --output "artifacts/hardware-telemetry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.jsonl" --require-metrics "$required"
